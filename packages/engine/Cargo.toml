[package]
name = "diffra-diff"
version = "0.1.0"
edition = "2021"
authors = ["Diffra"]
description = "Ultra-fast Rust SIMD pixel diff engine for Diffra visual regression testing"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.16.2", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "3.7.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
