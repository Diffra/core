[package]
name = "diffra-diff"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Diffra"]
description = "Pixel diff engine for Diffra visual regression testing"
license = "MIT"
repository = "https://github.com/Diffra/core"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.16.2", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "3.7.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
napi-build = "2.6.0"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
strip = "symbols"
