name: Bug report
description: Create a report to help us improve Diffra
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please ensure you have searched existing issues before filing a new one.
  - type: input
    id: version
    attributes:
      label: Diffra version
      description: What version of Diffra are you running? (`diffra --version`)
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version, OS, browser (e.g. Node 22.10, macOS Sequoia, Chromium 130)
      placeholder: e.g. Node 22.12.0, macOS ARM64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Please describe the exact steps to reproduce the behavior.
      placeholder: |
        1. Run `diffra test`
        2. View output in terminal
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste any terminal or CI logs here.
      render: shell
