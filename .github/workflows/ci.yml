name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # The Node runtime is pinned by devEngines.runtime in package.json and
      # provisioned by pnpm, so the version under test is the one developers use.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The engine is Rust. The crate declares the version it needs, and
      # runners may carry an older one.
      - name: Update Rust
        run: rustup update stable

      - name: Lint
        run: pnpm lint

      - name: Check Rust formatting and lints
        working-directory: packages/engine
        run: |
          cargo fmt --check
          cargo clippy --release

      # Workspace packages resolve each other through built output, so the
      # root typecheck script builds all packages first.
      - name: Build and typecheck
        run: pnpm typecheck

      - name: Install Playwright browsers
        run: pnpm --filter @diffra/core exec playwright install --with-deps chromium

      - name: Build demo Storybook
        run: pnpm --filter @diffra/demo-storybook build-storybook

      - name: Run test suite
        run: pnpm test

      # The bundle is not committed. A release builds it with every engine
      # binary, so here it only has to build.
      - name: Bundle the action
        if: matrix.os == 'ubuntu-latest'
        run: pnpm bundle
