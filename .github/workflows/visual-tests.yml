name: Visual Regression Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  visual-tests:
    name: Visual Regression (Storybook)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full git history required for merge-base baseline discovery

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The engine is Rust. The crate declares the version it needs, and
      # runners may carry an older one.
      - name: Update Rust
        run: rustup update stable

      - name: Build the workspace
        run: pnpm build

      - name: Build Storybook
        run: pnpm --filter @diffra/demo-storybook build-storybook

      # The action under test is this checkout, bundled with this runner's engine.
      - name: Bundle the action
        run: pnpm bundle

      - name: Restore visual regression baselines cache
        uses: actions/cache/restore@v6
        with:
          path: packages/demo-storybook/.diffra/baselines
          key: diffra-baselines-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            diffra-baselines-${{ runner.os }}-master-
            diffra-baselines-${{ runner.os }}-main-
            diffra-baselines-${{ runner.os }}-

      - name: Run Diffra Visual Regression
        id: diffra
        uses: ./
        with:
          workingDir: packages/demo-storybook
          storybookBuildDir: storybook-static
          token: ${{ secrets.GITHUB_TOKEN }}
          autoAcceptChanges: 'master'
          exitZeroOnChanges: 'true'

      - name: Save updated baselines cache on master or main
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && always()
        uses: actions/cache/save@v6
        with:
          path: packages/demo-storybook/.diffra/baselines
          key: diffra-baselines-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload Visual Regression Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: |
            packages/demo-storybook/.diffra/runs/**/index.html
            packages/demo-storybook/.diffra/runs/**/report.json
            packages/demo-storybook/.diffra/runs/**/diffs/
            packages/demo-storybook/.diffra/runs/**/candidates/
          retention-days: 14
