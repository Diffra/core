name: Release action

# The action runs from dist/ at the tag a workflow references (for example
# Diffra/core@v1). The engine is a Node-API binary, so a release builds it for
# every runner platform, bundles the action with all of them, and tags a
# commit that carries the binaries. Branches never carry them.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, for example v1.2.0'
        required: true
      major:
        description: 'Major tag to move to this release, for example v1 (leave empty to skip)'
        required: false

permissions:
  contents: write

jobs:
  engine:
    name: Engine (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux builds link against an old glibc so they load on every
          # supported runner image.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            flags: --use-napi-cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            flags: --use-napi-cross
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust for the target
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      - name: Build the engine
        run: pnpm --filter @diffra/engine run build --target ${{ matrix.target }} ${{ matrix.flags }}

      - name: Upload the engine binary
        uses: actions/upload-artifact@v7
        with:
          name: engine-${{ matrix.target }}
          path: packages/engine/*.node
          if-no-files-found: error

  release:
    name: Bundle and tag
    needs: engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Rust
        run: rustup update stable

      # The local build links against this runner's glibc; ship only the
      # binaries built above.
      - name: Build the workspace
        run: |
          pnpm build
          rm -f packages/engine/*.node

      - name: Download every engine binary
        uses: actions/download-artifact@v7
        with:
          pattern: engine-*
          path: packages/engine
          merge-multiple: true

      - name: Bundle the action with every engine binary
        run: |
          pnpm bundle
          ls dist/*.node

      - name: Commit the bundle and tag the release
        env:
          VERSION: ${{ inputs.version }}
          MAJOR: ${{ inputs.major }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --detach
          git add --force dist
          git commit --message "release: ${VERSION}"
          git tag "${VERSION}"
          git push origin "refs/tags/${VERSION}"
          if [ -n "${MAJOR}" ]; then
            git tag --force "${MAJOR}"
            git push --force origin "refs/tags/${MAJOR}"
          fi
